# SruNal KZ — Telegram-first stack for the server (Ubuntu + Docker).
#
# Quick start (full runbook: deploy/VDS.md):
#   cd backend && cp .env.example .env        # bot token, TOKEN_PEPPER, PUBLIC_BASE_URL
#   cd ../deploy && cp .env.example .env      # DOMAIN (DuckDNS), POSTGRES_PASSWORD
#   docker compose --profile tls up -d --build
#   docker compose exec -it api cline auth     # once: model credentials for the agent
#
# Without the `tls` profile only db + api start (api on 127.0.0.1:8080) — handy
# for a local rehearsal of the deployment.
#
# The Mini App and the API share one HTTPS origin (Caddy → api:8080); point the
# BotFather Mini App + menu button at https://<DOMAIN>.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: srunal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-srunal}
      POSTGRES_DB: srunal
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U srunal -d srunal"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: srunal-tgbot:latest
    restart: unless-stopped
    env_file:
      - ../backend/.env
    environment:
      # Compose overrides: talk to the db service and keep every artefact on
      # the data volume instead of the working directory. These win over the
      # local backend/.env, whose paths are for development on the host.
      APP_ENV: prod
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://srunal:${POSTGRES_PASSWORD:-srunal}@db:5432/srunal?sslmode=disable
      TZ: Asia/Almaty
      STORAGE_DIR: /data/storage
      GENERATOR_DIR: /data/generator
      GENERATOR_CONFIG_DIR: /data/cline
      GENERATOR_DATA_DIR: /data/cline
      MINIAPP_DIR: /app/miniapp
      SKILL_SOURCE_DIR: /app/skills
      # Behind Caddy the real client IP arrives in X-Forwarded-For.
      TRUST_PROXY: "true"
      # auto = fall back to the built-in writer when the AI CLI is not usable.
      GENERATOR_MODE: ${GENERATOR_MODE:-agent}
    volumes:
      - app-data:/data
    ports:
      # Only on the loopback interface: the public entry point is Caddy (HTTPS).
      # Useful for `curl http://127.0.0.1:8080/api/health` on the server.
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy

  # HTTPS terminator: Let's Encrypt automatically, HTTP → HTTPS redirect.
  # Enabled with `docker compose --profile tls up -d`; DOMAIN comes from
  # deploy/.env (for example srunal.duckdns.org).
  caddy:
    image: caddy:2-alpine
    profiles: ["tls"]
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in deploy/.env, e.g. srunal.duckdns.org}
      ACME_EMAIL: ${ACME_EMAIL:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy

volumes:
  db-data:
  app-data:
  caddy-data:
  caddy-config:

{ lineHeight: "20px", fontWeight: "600" }], "chip": ["13px", { lineHeight: "16px", fontWeight: "600" }], "section-label": ["13px", { lineHeight: "16px", letterSpacing: "0.4px", fontWeight: "600" }], "button": ["16px", { lineHeight: "20px", fontWeight: "600" }], "body-secondary": ["14px", { lineHeight: "20px", fontWeight: "400" }], "step-label": ["12px", { lineHeight: "16px", fontWeight: "400" }], "caption": ["13px", { lineHeight: "18px", fontWeight: "400" }], "order-code": ["15px", { lineHeight: "20px", fontWeight: "500" }], "headline-md": ["17px", { lineHeight: "24px", fontWeight: "600" }], "headline-lg": ["22px", { lineHeight: "28px", fontWeight: "600" }] } } } };</script></head><body class="bg-page-bg-light text-on-surface antialiased min-h-screen flex flex-col"><header class="fixed top-0 inset-x-0 z-50 bg-page-bg-light/90 backdrop-blur-xl pt-safe shadow-[0_1px_8px_rgba(0,0,0,0.04)]"><div class="h-14 px-margin flex items-center justify-between max-w-[480px] mx-auto w-full"><div class="flex items-center gap-space-xs"><button class="w-11 h-11 -ml-space-xs flex items-center justify-center text-status-progress-text active:opacity-60 transition-opacity" onclick="history.back()"><span class="material-symbols-outlined text-[24px]">arrow_back_ios_new</span></button><h1 class="font-headline-md text-headline-md text-on-surface truncate">Мастер Заказа</h1></div><div class="flex items-center"><img alt="Profile" class="w-8 h-8 rounded-full object-cover" src="https://lh3.googleusercontent.com/aida/AEtjO1UcJdilP7Lyyo9eL3p-gx06vIdlmdXkr9tcHlD3zjByB5xehndlFsDHfqI_hKobnK4IpXIre3ggaG6Udq1fhvIs47Fu6tFMkyeZShv3zHR9Mw_6yuKHyltTUm7zJsLjOh9sILb8p0suro7zvJwDHc3RiD0MXcBNFFGBaoh4POU9UUqVBoKaH86fz2Imxsm__B9ozOGxfugPW2TB4oVB2W5BTqhfHz-fhPJ_ZxGTcxHYTHRluLO0XgDNFTH0"></div></div></header><main class="flex-1 flex flex-col relative w-full max-w-[480px] mx-auto px-margin pt-14 pb-safe bg-page-bg-light"><div class="flex flex-col w-full pb-24">
<!-- Step Progress Section -->
<div class="flex flex-col gap-space-xs pt-space-xs pb-space-md">
<div class="flex items-center justify-between">
<span class="font-headline-lg text-[22px] font-semibold text-on-surface leading-tight">Данные для титульного листа</span>
<span class="font-step-label text-step-label text-text-secondary-light">Шаг 3 из 4</span>
</div>
<!-- 4-segment Progress Bar -->
<div class="grid grid-cols-4 gap-2 w-full pt-1">
<div class="h-1 rounded-full bg-status-progress-text"></div>
<div class="h-1 rounded-full bg-status-progress-text"></div>
<div class="h-1 rounded-full bg-status-progress-text"></div>
<div class="h-1 rounded-full bg-separator-light"></div>
</div>
</div>
<!-- SECTION 1: PRESETS -->
<div class="flex flex-col mb-space-lg">
<div class="px-space-xs pb-space-xs">
<span class="font-section-label text-section-label uppercase tracking-[0.4px] text-text-secondary-light">Шаблоны данных</span>
</div>
<!-- Presets Card Group -->
<div class="bg-surface-light rounded-[14px] flex flex-col overflow-hidden">
<!-- Preset Item 1 (Active) -->
<button class="preset-option w-full flex items-center px-margin py-3 text-left active:bg-status-progress-bg/40 transition-colors relative" data-preset="main" type="button">
<div class="w-9 h-9 rounded-full bg-status-progress-bg text-status-progress-text flex items-center justify-center shrink-0 mr-space-sm">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
<div class="flex-1 min-w-0 pr-space-xs">
<div class="font-body-strong text-body-strong text-on-surface truncate">Основной (ИЦИТ, 3 курс)</div>
<div class="font-body-secondary text-body-secondary text-text-secondary-light truncate">Бекболатов А. · CS101 · Мырзабеков Е.</div>
</div>
<span class="material-symbols-outlined text-status-progress-text text-[22px]" style="font-variation-settings: 'FILL' 1;">radio_button_checked</span>
</button>
<!-- Inset Separator -->
<div class="ml-[52px] h-[1px] bg-separator-light"></div>
<!-- Preset Item 2 (Inactive) -->
<button class="preset-option w-full flex items-center px-margin py-3 text-left active:bg-status-progress-bg/40 transition-colors relative" data-preset="minor" type="button">
<div class="w-9 h-9 rounded-full bg-surface-container text-text-secondary-light flex items-center justify-center shrink-0 mr-space-sm">
<span class="material-symbols-outlined text-[20px]">school</span>
</div>
<div class="flex-1 min-w-0 pr-space-xs">
<div class="font-body-strong text-body-strong text-on-surface truncate">Второй профиль (Майнор)</div>
<div class="font-body-secondary text-body-secondary text-text-secondary-light truncate">Бекболатов А. · ECO204 · Смагулова Д.</div>
</div>
<span class="material-symbols-outlined text-text-secondary-light text-[22px]">radio_button_unchecked</span>
</button>
<!-- Inset Separator -->
<div class="ml-[52px] h-[1px] bg-separator-light"></div>
<!-- Action: Save Preset -->
<button class="w-full flex items-center px-margin h-[52px] text-left active:bg-status-progress-bg/40 transition-colors" id="savePresetBtn" type="button">
<div class="w-9 h-9 rounded-full bg-status-progress-bg text-status-progress-text flex items-center justify-center shrink-0 mr-space-sm">
<span class="material-symbols-outlined text-[20px]">add</span>
</div>
<span class="font-body-secondary-strong text-body-secondary-strong text-status-progress-text">Сохранить текущие данные как шаблон</span>
</button>
</div>
<!-- Group Caption -->
<div class="px-space-xs pt-space-xs">
<p class="font-caption text-caption text-text-secondary-light">Выберите сохранённый профиль или заполните поля ниже.</p>
</div>
</div>
<!-- SECTION 2: ACADEMIC DETAILS FORM -->
<div class="flex flex-col mb-space-lg">
<div class="px-space-xs pb-space-xs">
<span class="font-section-label text-section-label uppercase tracking-[0.4px] text-text-secondary-light">Учебные данные</span>
</div>
<!-- Form Group Card -->
<div class="bg-surface-light rounded-[14px] flex flex-col overflow-hidden">
<!-- Row 1: Institute (Select) -->
<div class="flex flex-col px-margin pt-3 pb-2 active:bg-status-neutral-bg transition-colors cursor-pointer">
<label class="font-section-label text-[11px] font-semibold text-text-secondary-light uppercase tracking-wider mb-1">Институт *</label>
<div class="flex items-center justify-between min-h-[28px]">
<span class="font-body-lg text-body-lg text-on-surface truncate pr-space-xs">Институт цифровой инженерии (ИЦИТ)</span>
<span class="material-symbols-outlined text-text-secondary-light text-[20px] shrink-0">chevron_right</span>
</div>
</div>
<div class="ml-[52px] h-[1px] bg-separator-light"></div>
<!-- Row 2: Department (Input) -->
<div class="flex flex-col px-margin pt-3 pb-2 active:bg-status-neutral-bg transition-colors cursor-pointer"><label class="font-section-label text-[11px] font-semibold text-text-secondary-light uppercase tracking-wider mb-1">Кафедра *</label><div class="flex items-center justify-between min-h-[28px]"><span class="font-body-lg text-body-lg text-on-surface truncate pr-space-xs">Кафедра компьютерных наук</span><span class="material-symbols-outlined text-text-secondary-light text-[20px] shrink-0">chevron_right</span></div></div>
<div class="ml-[52px] h-[1px] bg-separator-light"></div>
<!-- Row 3: Student Full Name (Input) -->
<div class="flex flex-col px-margin pt-3 pb-2 focus-within:bg-status-progress-bg/20 transition-colors">
<label class="font-section-label text-[11px] font-semibold text-text-secondary-light uppercase tracking-wider mb-1" for="name-input">ФИО студента *</label>
<input class="bg-transparent border-0 p-0 font-body-lg text-body-lg text-on-surface focus:outline-none w-full" id="name-input" spellcheck="false" type="text" value="Ануар Бекболатов">
</div>
<div class="ml-[52px] h-[1px] bg-separator-light"></div>
<!-- Row 4: Discipline Code (Input) -->
<div class="flex flex-col px-margin pt-3 pb-2 focus-within:bg-status-progress-bg/20 transition-colors">
<label class="font-section-label text-[11px] font-semibold text-text-secondary-light uppercase tracking-wider mb-1" for="disc-input">Шифр оп *</label>
<input class="bg-transparent border-0 p-0 font-body-lg text-body-lg text-on-surface focus:outline-none w-full" id="disc-input" spellcheck="false" type="text" value="CS101 · Алгоритмы и структуры данных">
</div>
<div class="ml-[52px] h-[1px] bg-separator-light"></div>
<!-- Row 5: Teacher (Input) -->
<div class="flex flex-col px-margin pt-3 pb-2 focus-within:bg-status-progress-bg/20 transition-colors">
<label class="font-section-label text-[11px] font-semibold text-text-secondary-light uppercase tracking-wider mb-1" for="teacher-input">ФИО Преподавателя *</label>
<input class="bg-transparent border-0 p-0 font-body-lg text-body-lg text-on-surface focus:outline-none w-full" id="teacher-input" spellcheck="false" type="text" value="Ержан Мырзабеков">
</div>
</div>
</div>
<!-- SECTION 3: CHECKBOX CARD -->
<div class="bg-surface-light rounded-[14px] flex items-center px-margin py-3 mb-space-lg select-none cursor-pointer active:opacity-80 transition-opacity" id="updateTemplateRow">
<div class="w-6 h-6 rounded-md bg-status-progress-text text-on-primary flex items-center justify-center shrink-0 mr-space-sm" id="checkboxBox">
<span class="material-symbols-outlined text-[18px] font-bold" id="checkboxIcon">check</span>
</div>
<span class="font-body-secondary text-body-secondary text-on-surface leading-tight">Обновить шаблон «Основной» этими данными</span>
</div>
<!-- Pinned Bottom Telegram MainButton -->
<div class="fixed bottom-0 inset-x-0 bg-page-bg-light/95 backdrop-blur-md p-4 pb-8 z-40 max-w-[480px] mx-auto w-full">
<button class="w-full h-12 bg-status-progress-text active:scale-[0.98] active:opacity-80 transition-all rounded-xl text-on-primary font-button text-button flex items-center justify-center gap-space-xs" id="nextButton" type="button">
<span class="">Далее →</span>
</button>
</div>
</div>
<script>
  (function() {
    const updateRow = document.getElementById('updateTemplateRow');
    const checkboxBox = document.getElementById('checkboxBox');
    const checkboxIcon = document.getElementById('checkboxIcon');
    let isChecked = true;

    if (updateRow) {
      updateRow.addEventListener('click', () => {
        isChecked = !isChecked;
        if (isChecked) {
          checkboxBox.classList.remove('bg-surface-variant', 'text-transparent');
          checkboxBox.classList.add('bg-status-progress-text', 'text-on-primary');
          checkboxIcon.classList.remove('hidden');
        } else {
          checkboxBox.classList.remove('bg-status-progress-text', 'text-on-primary');
          checkboxBox.classList.add('bg-surface-variant', 'text-transparent');
          checkboxIcon.classList.add('hidden');
        }
      });
    }

    const presets = document.querySelectorAll('.preset-option');
    presets.forEach(p => {
      p.addEventListener('click', function() {
        presets.forEach(item => {
          const icon = item.querySelector('.material-symbols-outlined:last-child');
          const badge = item.querySelector('.rounded-full:first-child');
          if (icon) {
            icon.textContent = 'radio_button_unchecked';
            icon.classList.remove('text-status-progress-text');
            icon.classList.add('text-text-secondary-light');
            icon.style.fontVariationSettings = "'FILL' 0";
          }
          if (badge) {
            badge.className = 'w-9 h-9 rounded-full bg-surface-container text-text-secondary-light flex items-center justify-center shrink-0 mr-space-sm';
            badge.innerHTML = '<span class="material-symbols-outlined text-[20px]">school</span>';
          }
        });

        const activeIcon = this.querySelector('.material-symbols-outlined:last-child');
        const activeBadge = this.querySelector('.rounded-full:first-child');
        if (activeIcon) {
          activeIcon.textContent = 'radio_button_checked';
          activeIcon.classList.add('text-status-progress-text');
          activeIcon.classList.remove('text-text-secondary-light');
          activeIcon.style.fontVariationSettings = "'FILL' 1";
        }
        if (activeBadge) {
          activeBadge.className = 'w-9 h-9 rounded-full bg-status-progress-bg text-status-progress-text flex items-center justify-center shrink-0 mr-space-sm';
          activeBadge.innerHTML = '<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: \'FILL\' 1;">check</span>';
        }

        if (this.dataset.preset === 'minor') {
          document.getElementById('dept-input').value = 'Кафедра экономики и менеджмента';
          document.getElementById('disc-input').value = 'ECO204 · Микроэкономика';
          document.getElementById('teacher-input').value = 'Динара Смагулова';
        } else {
          document.getElementById('dept-input').value = 'Кафедра компьютерных наук';
          document.getElementById('disc-input').value = 'CS101 · Алгоритмы и структуры данных';
          document.getElementById('teacher-input').value = 'Ержан Мырзабеков';
        }
      });
    });
  })();
</script></main>


</body></html>
